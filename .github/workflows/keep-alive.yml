name: Keep Server Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend para que no duerma
        run: curl -sS -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" --max-time 120 https://expedientes-api-2dje.onrender.com/health
